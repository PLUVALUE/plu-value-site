<style>

:root[data-theme="dark"]{

  --accent:#5cc2a0; --accent-soft:#1f3229; --ochre:#e0a062; --ochre-soft:#33281c; --stop:#ea8a6e; --stop-soft:#3a231c; color-scheme:dark}
*{box-sizing:border-box}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;

footer.legal a{color:var(--accent)}

@media (prefers-reduced-motion:no-preference){.prog i{transition:width .25s ease}#view{animation:in .18s ease}}
@keyframes in{from{transform:translateY(6px)}to{transform:none}}
</style></head><body>
<div class="wrap">
  <div class="bar">
    <button class="back" id="back" type="button" hidden>Retour</button>
    <a class="brand" href="/" aria-label="PLU Value, accueil">PLU Value · diagnostic</a>
    <div class="count" id="count"></div>
  </div>
  <div class="prog" aria-hidden="true"><i id="prog"></i></div>
  <main id="view" class="stack" aria-live="polite"></main>
  <footer class="legal">PLU Value, marque exploitée par LATULIPE SAS. Aucun résultat n'est garanti : chaque projet dépend des règles d'urbanisme et de l'accord de la mairie. <a href="/mentions-legales.html">Mentions légales</a> · <a href="/confidentialite.html">Confidentialité</a></footer>
</div>

<script>
const $=id=>document.getElementById(id);
const view=$("view");
const esc=t=>String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S={},idx=-1,hist=[],blocOnly=false,stopInfo=null,K=new Set(),FID=null,ficheInfo=null,isEx=false;
const API="https://xkuiwbrtnrhyjbbktule.supabase.co/functions/v1/fiche";
async function api(body){const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});return r.json()}

/* ---------- Étapes : une question par écran ---------- */
const STEPS=[
 {id:"type",q:"Quel bien vendez-vous ?",opts:[
   ["maison","Maison"],["maison2","Maison avec dépendance ou second logement"],
   ["immeuble","Petit immeuble, un seul propriétaire"],["appart","Appartement en copropriété"]],
  stop:s=>s.type==="appart"&&{t:"Un appartement en copropriété ne se valorise pas par division.",fix:"PLU Value travaille sur les maisons, les terrains et les immeubles en monopropriété."}},
 {id:"mois",q:"Depuis combien de temps est-il en vente ?",opts:[
   ["pre","Pas encore en vente","Le vendeur veut un prix que le marché ne donnera pas"],
   ["<4","Moins de 4 mois"],["4-6","4 à 6 mois"],["6-12","6 à 12 mois"],[">12","Plus d'un an"]]},
 {id:"baisses",q:"Combien de baisses de prix déjà faites ?",when:s=>s.mois!=="pre",opts:[["0","Aucune"],["1","Une"],["2","Deux ou plus"]],
  stop:s=>s.mois==="<4"&&s.baisses==="0"&&{t:"Ce mandat n'est pas bloqué : moins de 4 mois, aucune baisse.",fix:"Laissez le marché répondre. Revenez si le bien n'a pas d'offre au bout de 4 mois."}},
 {id:"proprio",q:"Qui décide de la vente ?",opts:[
   ["seul","Un seul propriétaire, ou un couple d'accord"],["accord","Plusieurs propriétaires, tous d'accord"],
   ["desaccord","Plusieurs propriétaires, pas tous d'accord"],["nsp","Je ne sais pas encore"]],
  stop:s=>s.proprio==="desaccord"&&{t:"Les propriétaires ne sont pas d'accord entre eux.",fix:"Une valorisation demande la signature de tous. Revenez quand l'indivision parle d'une seule voix."}},
 {id:"delai",q:"Le vendeur peut-il attendre un an s'il y gagne ?",opts:[
   ["ok","Oui, il n'est pas pressé"],["presse","Non, il a besoin de l'argent ou doit se reloger avant"],["nsp","Je ne sais pas encore"]],
  stop:s=>s.delai==="presse"&&{t:"Le vendeur a besoin de vendre vite.",fix:"Une valorisation passe par la mairie puis par plusieurs ventes. Pour lui, le bon levier est le prix."}},
 {id:"permis",q:"Un permis ou une division est déjà déposé ou obtenu ?",opts:[["non","Non"],["oui","Oui"],["nsp","Je ne sais pas"]],
  stop:s=>s.permis==="oui"&&{t:"Le dossier d'urbanisme est déjà lancé.",fix:"La valeur est déjà en cours de création par le vendeur : il reste peu à apporter."}},
 {id:"lieu",bloc:true,q:"Où se situe le bien ?",fields:[
   ["commune","Commune","text",true,"tapez les premières lettres"],["adresse","Numéro et rue","text",false,"facultatif"]]},
 {id:"bien",bloc:true,q:"Le bien en chiffres",fields:[
   ["surface","Surface habitable (m²)","range",true,null,{min:40,max:500,step:5,def:()=>150,must:()=>true,onset:()=>{const p=$("f_prix");if(p&&!p.dataset.t)p._set(defPrix(),false)}}],
   ["terrain","Surface du terrain (m²)","range",false,"0 s'il n'y en a pas",{min:0,max:3000,step:25,def:()=>500,must:()=>!blocOnly}],
   ["prix","Prix affiché ou demandé (€)","range",false,"prérempli à titre indicatif : réglez-le sur le prix du mandat",{min:100000,max:3000000,step:10000,def:()=>defPrix(),opt:true}]]},
 {id:"position",q:"Où est la maison sur le terrain ?",opts:[
   ["devant","Côté rue, terrain libre derrière"],["fond","Au fond, terrain libre devant"],
   ["cote","Sur un côté, passage libre de l'autre"],["milieu","Au milieu du terrain"],["sans","Pas de terrain libre"]]},
 {id:"acces",q:"Peut-on rejoindre le terrain libre sans traverser la maison ?",when:s=>s.position!=="sans"&&s.position!=="milieu",
  opts:[["oui","Oui","Passage latéral, seconde rue ou façade large"],["non","Non"],["averifier","À vérifier sur place"]]},
 {id:"entrees",q:"Combien d'entrées indépendantes possibles ?",opts:[
   ["1","Une seule"],["2","Deux","Étage desservi à part, dépendance, garage aménageable"],["3","Trois ou plus"]]},
 {id:"marche",bloc:true,q:"Le marché du secteur",
  dyn:()=>({q:"Le marché du secteur",help:dv().pm2?`Prérempli avec les ventes réelles 2023-2025 à ${S.commune}. Ajustez si le quartier vaut plus ou moins.`:"Trop peu de ventes récentes dans cette commune : indiquez ce que vous constatez."}),fields:[
   ["pm2","Prix au m² d'une maison familiale (€)","range",true,null,{min:1000,max:16000,step:50,def:()=>dv().pm2||4000,must:()=>!dv().pm2}],
   ["lot","Prix d'un terrain à bâtir (€)","range",false,()=>dv().lot?"médiane des ventes de la commune":"estimation : réglez-le si vous avez une vente récente",{min:50000,max:1500000,step:5000,def:()=>defLot(),opt:true,keep:()=>!!dv().lot}],
   ["travaux","État du bien","seg",true,null,{def:"1",opts:[["0","Bon état"],["1","À rafraîchir"],["2","Gros travaux"]]}],
   ["dpe","DPE","seg",true,null,{def:"D",opts:[["D","A à D"],["E","E"],["F","F ou G"],["?","Inconnu"]]}]]},
 {id:"travaux",q:"Dans quel état est le bien ?",when:()=>K.has("marche"),opts:[["0","Bon état"],["1","À rafraîchir"],["2","Gros travaux"]]},
 {id:"ref",q:"",when:s=>!blocOnly&&compute().lever,dyn:()=>{const r=compute();return{q:"Le vendeur accepterait-il de repartir de ce niveau ?",
   help:`Vendu en un seul lot, ce bien vaut aujourd'hui entre ${rng(r.v1,.07)}. C'est la base du prix de référence, avec une part de tout ce qui se vend au-dessus.`}},
  opts:[["oui","Oui"],["proposer","Je dois lui en parler"],["non","Non, il tient à son prix"]]}
];
const EXEMPLE={type:"maison",mois:"6-12",baisses:"1",proprio:"seul",delai:"ok",permis:"non",commune:"Exemple",adresse:"",surface:240,terrain:1100,prix:890000,
  position:"devant",acces:"oui",entrees:"2",pm2:4200,lot:240000,travaux:"1",dpe:"E",ref:"oui"};

/* ---------- Calcul ---------- */
const k5=n=>Math.round(n/5000)*5;
const eur=n=>isFinite(n)?k5(n).toLocaleString("fr-FR")+" k€":"–";
const rng=(a,p)=>`${eur(a*(1-p))} et ${eur(a*(1+p))}`;
const kSize=s=>s<=120?1:s<=150?.92:s<=200?.85:s<=250?.8:.75;
const SEUIL=50000, LOT_MIN=400;
function compute(){
  const S_=+S.surface,T=+S.terrain||0,P=+S.pm2,out={ok:S_>0&&P>0,raisons:[]};
  if(!out.ok)return out;
  const kE=S.dpe==="F"?.93:S.dpe==="E"?.97:1, kT=S.travaux==="2"?.88:S.travaux==="1"?.98:1;
  const pBig=P*kSize(S_)*kE*kT, v1=S_*pBig;
  const emp=S_/1.6*1.1, keep=Math.max(400,emp*4), reste=Math.max(0,T-keep);
  const divOK=S.position!=="milieu"&&S.position!=="sans"&&S.acces!=="non"&&S.type!=="appart";
  const nLots=divOK?Math.min(3,Math.floor(reste/LOT_MIN)):0;
  const lotVal=+S.lot||P*.12*Math.min(550,Math.max(LOT_MIN,reste/Math.max(1,nLots)));
  const lotNet=Math.max(0,lotVal-25000);
  const ent=+S.entrees||1, nLog=Math.min(4,Math.floor(S_/70));
  const cutOK=S_>=130&&nLog>=2&&(ent>=2||S.type==="maison2"||S.type==="immeuble");
  const sLog=cutOK?S_*.92/nLog:0, vB=cutOK?nLog*sLog*P*kSize(sLog)*kE*kT*.92:0;
  const c=[];
  if(nLots)c.push({nom:`terrain détaché en ${nLots} lot${nLots>1?"s":""} à bâtir, maison conservée`,v2:v1*.97+nLots*lotNet,frais:30000});
  if(cutOK)c.push({nom:`maison vendue en ${nLog} logements`,v2:vB,frais:40000});
  if(nLots&&cutOK)c.push({nom:`${nLog} logements et ${nLots} lot${nLots>1?"s":""} à bâtir`,v2:vB*.97+nLots*lotNet,frais:40000});
  let best=null;for(const x of c){x.net=x.v2*.92-x.frais;if(!best||x.net>best.net)best=x}
  if(!nLots){
    if(S.position==="milieu")out.raisons.push("Maison au milieu du terrain : pas de lot à bâtir détachable.");
    else if(S.position==="sans")out.raisons.push("Pas de terrain libre à détacher.");
    else if(S.acces==="non")out.raisons.push("Terrain libre sans accès : pas de lot à bâtir.");
    else out.raisons.push(`Terrain trop petit pour un lot à bâtir : il en faudrait environ ${Math.round((keep+LOT_MIN)/10)*10} m².`);
  }
  if(!cutOK){
    if(S_<130)out.raisons.push("Surface habitable trop faible pour créer plusieurs logements.");
    else out.raisons.push("Une seule entrée possible : pas de logements indépendants sans gros travaux.");
  }
  out.v1=v1;out.pBig=pBig;out.best=best;out.reste=reste;out.nLots=nLots;out.cutOK=cutOK;out.nLog=nLog;
  out.gain=best?best.net-v1:0;
  out.lever=!!best&&out.gain>=SEUIL;
  if(best&&!out.lever)out.raisons.push("Gain trop faible une fois les frais et l'aléa déduits : l'opération ne se justifie pas.");
  return out;
}
const DIVISER=["grigny","etampes","sarcelles","goussainville","trappes","montfermeil","aulnay-sous-bois"];
const norm=t=>String(t||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").trim().replace(/\s+/g,"-");
const MOIS={"pre":"pas encore en vente","<4":"moins de 4 mois","4-6":"4 à 6 mois","6-12":"6 à 12 mois",">12":"plus d'un an"};

/* ---------- Navigation ---------- */
const visible=st=>(blocOnly?!!st.bloc:true)&&!K.has(st.id)&&(!st.when||st.when(S));
function go(i){while(i<STEPS.length&&!visible(STEPS[i]))i++;if(i>=STEPS.length)return verdict();hist.push(idx);idx=i;draw()}
function answer(st){
  if(st.id==="bien"&&!FID&&!isEx)api({commune:S.commune,cp:S.cp,surface:S.surface}).then(r=>{const c=r.candidats||[];if(c.length){const d=x=>Math.abs((+x.prix||0)-(+S.prix||+x.prix||0));c.sort((a,b)=>d(a)-d(b));FID=c[0].id}}).catch(()=>{});
  const s=st.stop&&st.stop(S);if(s){stopInfo=s;hist.push(idx);idx="stop";return drawStop()}go(idx+1)}
function chrome(n){
  const tot=STEPS.filter(visible).length;
  $("back").hidden=idx===-1;
  $("count").textContent=typeof n==="number"?`${n} / ${tot}`:"";
  $("prog").style.width=(typeof n==="number"?Math.round((n-1)/tot*100):(idx===-1||idx==="agent"||idx==="lien"||idx==="recap")?0:100)+"%";
  window.scrollTo(0,0);
}
function draw(){
  if(idx===-1)return intro();
  const st=STEPS[idx],d=st.dyn?st.dyn():st,n=STEPS.slice(0,idx+1).filter(visible).length;
  chrome(n);
  let h=`<h1>${esc(d.q||st.q)}</h1>`+(d.help||st.help?`<p class="lede">${esc(d.help||st.help)}</p>`:"");
  if(st.opts)h+=`<div class="stack">`+st.opts.map(([v,l,sub])=>`<button type="button" class="opt" data-v="${esc(v)}">${esc(l)}${sub?`<small>${esc(sub)}</small>`:""}</button>`).join("")+`</div>`;
  else h+=`<form id="ff" class="stack" novalidate>`+st.fields.map(fieldHTML).join("")+`<div class="err" id="err"></div><button class="cta" type="submit">Continuer</button></form>`;
  view.innerHTML=h;
  if($("sug"))suggest();
  if(st.fields){wire(st);$("ff").addEventListener("submit",e=>{e.preventDefault();
    for(const[k,l,t,req,,o]of st.fields){
      if(t==="range"){const el=$("f_"+k),touched=!!el.dataset.t;
        if(o.must&&o.must()&&!touched){$("err").textContent=`Réglez : ${l.replace(/ \(.*/,"")}.`;$("r_"+k).focus();return}

  <form id="fl" class="stack" novalidate><label for="lien">Lien de l'annonce<input id="lien" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://…"></label>
  <div class="err" id="err">${esc(msg||"")}</div><button class="cta" type="submit" id="go">Analyser l'annonce</button></form>
  <button class="cta ghost" type="button" data-act="manuel">Je n'ai pas de lien, je saisis à la main</button>`;
  $("fl").addEventListener("submit",async e=>{e.preventDefault();const u=$("lien").value.trim();
    if(!/^https?:\/\//i.test(u)){$("err").textContent="Collez l'adresse complète de l'annonce, qui commence par https://";return}
    const b=$("go");b.disabled=true;b.textContent="Lecture de l'annonce…";
    try{const r=await api({url:u});if(r.ok&&r.fiche){applyFiche(r.fiche,r);return afterFiche()}drawLien(MSG[r.raison]||MSG.erreur)}catch(e){drawLien(MSG.erreur)}});
}
function applyFiche(f,r){
  FID=f.id;ficheInfo=f;K=new Set();
  if(["maison","immeuble","appart"].includes(f.type)){S.type=f.type;K.add("type")}
  if(f.commune){S.commune=f.commune;S.cp=f.cp||"";K.add("lieu")}
  if(f.surface)S.surface=+f.surface;if(f.terrain!=null)S.terrain=+f.terrain;if(f.prix)S.prix=+f.prix;
  if(f.surface&&f.prix&&f.terrain!=null&&f.commune)K.add("bien");
  if(!(r&&r.anciennete_inconnue)&&f.mois_min!=null&&f.mois_min>=4&&f.mois_min<240){S.mois=f.mois_min>=12?">12":f.mois_min>=6?"6-12":"4-6";K.add("mois")}
  if(f.nb_baisses>=1){S.baisses=f.nb_baisses>=2?"2":"1";K.add("baisses")}
  S.dpe=!f.dpe?"?":"ABCD".includes(f.dpe)?"D":f.dpe==="E"?"E":"F";
  const d=dv();if(d.pm2){S.pm2=d.pm2;S.lot=d.lot?d.lot*1000:"";K.add("marche")}
  const a=f.deja_repondu||{};for(const k of["proprio","delai","permis","position","acces","entrees"])if(a[k]&&S[k]===undefined){S[k]=a[k];K.add(k)}
}
function afterFiche(){
  hist.push("lien");
  for(const st of STEPS)if(K.has(st.id)&&st.stop){const s=st.stop(S);if(s){stopInfo=s;idx="stop";return drawStop()}}
  drawRecap();
}
function drawRecap(){
  idx="recap";chrome();const f=ficheInfo,L=[];
  const T={maison:"Maison",immeuble:"Immeuble",appart:"Appartement"};
  if(f.commune)L.push(`${T[f.type]||"Bien"} à ${f.commune}${f.cp?" ("+f.cp+")":""}`);else if(T[f.type])L.push(T[f.type]);
  if(f.surface)L.push(`${f.surface} m² habitables`);
  if(f.terrain!=null)L.push(+f.terrain?`${f.terrain} m² de terrain`:"Pas de terrain");
  if(f.prix)L.push(`Prix affiché : ${Number(f.prix).toLocaleString("fr-FR")} €`);
  if(f.dpe)L.push(`DPE ${f.dpe}`);
  if(K.has("mois"))L.push(`En ligne depuis au moins ${f.mois_min} mois`);
  if(K.has("baisses"))L.push(f.nb_baisses>=2?"Plusieurs baisses de prix":"Une baisse de prix");
  if(K.has("marche"))L.push(`Prix du secteur : ventes réelles 2023-2025 à ${S.commune}`);
  const n=STEPS.filter(visible).length;
  view.innerHTML=`<span class="chip go">${f.connu?"Bien déjà suivi par PLU Value":"Annonce lue"}</span>
  <h1>${n?`Il nous manque ${n} information${n>1?"s":""} pour finir l'évaluation.`:"Nous avons tout ce qu'il faut."}</h1>
  <div class="card"><h2>Ce que nous savons déjà</h2><ul class="why">${L.map(t=>`<li class="ok"><b>✓</b><span>${esc(t)}</span></li>`).join("")}</ul></div>
  <button class="cta" type="button" data-act="suite">Continuer</button>
  <button class="cta ghost" type="button" data-act="corriger">Corriger ces informations</button>`;
}

  <p class="lede">Dites-nous qui vous êtes : le parcours s'adapte. L'étude préalable est gratuite et ne vous engage à rien.</p>

function drawAgent(){

}
function drawStop(){

}

/* ---------- Résultat ---------- */
function reasons(r,lever){
  const L=[],add=(k,t)=>L.push([k,t]);
  if(stopInfo)add("no",stopInfo.t);
  if(lever){
    add("ok",`Levier identifié : ${r.best.nom}.`);
    if(S.mois===">12"||S.mois==="6-12"||+S.baisses>=1)add("ok","Bien en vente depuis longtemps ou déjà baissé : le vendeur est prêt à entendre une autre solution.");
    if(S.proprio==="seul")add("ok","Un seul décideur.");
    if(S.ref==="oui")add("ok","Vendeur d'accord pour repartir de la valeur réaliste.");
  }else if(!stopInfo||blocOnly){
    if(S.ref==="non")add("no","Le vendeur tient à son prix : sans accord sur le prix de référence, pas d'opération possible.");
    else if(!blocOnly)r.raisons.forEach(t=>add("no",t));
  }
  if(lever){
    add("chk","Règles d'urbanisme de la parcelle : vérifiées par PLU Value avant tout rendez-vous.");
    if(DIVISER.includes(norm(S.commune)))add("chk","Commune où la création de logements peut exiger une autorisation préalable.");
    if(S.acces==="averifier")add("chk","Accès au terrain libre à confirmer sur place.");
    if(S.proprio==="nsp")add("chk","Nombre de propriétaires et accord de chacun.");
    if(S.delai==="nsp")add("chk","Délai réel du vendeur.");
    if(S.permis==="nsp")add("chk","Aucune demande d'urbanisme déjà déposée.");
    if(S.ref==="proposer")add("chk","Accord du vendeur sur le prix de référence.");
    if(!+S.lot&&r.nLots)add("chk","Prix d'un terrain à bâtir estimé par défaut.");
  }
  return L;
}
const SYM={ok:"✓",no:"✕",chk:"?"};
function ficheTexte(r){
  return `Première estimation en valorisation – ${S.commune}
Maison ou immeuble de ${S.surface} m²${+S.terrain?` sur ${S.terrain} m² de terrain`:""}

1. Vendu en un seul lot aujourd'hui : entre ${rng(r.v1,.07)}
Les grandes surfaces se vendent moins cher au m² : peu d'acheteurs peuvent les financer.

2. Vendu en plusieurs lots : entre ${eur(r.best.v2*.88)} et ${eur(r.best.v2*.98)}

Comment ça marche

- PLU Value avance tous les frais : études, géomètre, démarches en mairie.
- Vous restez propriétaire jusqu'aux ventes chez votre notaire.
- PLU Value ne gagne rien si les lots se vendent au prix de référence. Elle se rémunère sur une part de ce qui est vendu au-dessus.

Prochaine étape : étude complète gratuite, puis rendez-vous avec votre agent.

Avis indicatif établi à partir des informations transmises. Ce n'est ni une expertise, ni une offre d'achat, ni un engagement de prix.
PLU Value – contact@plu-value.fr – 07 56 98 67 00`;
}
function dossierTexte(r,lever){
  return `Diagnostic de mandat PLU Value – ${lever?"LEVIER POSSIBLE":"pas de levier"}
Bien : ${S.type||""}, ${S.adresse||""} ${S.cp||""} ${S.commune||""} – ${S.surface} m² hab., terrain ${S.terrain||"?"} m², prix affiché ${S.prix||"?"} €
Mandat : ${MOIS[S.mois]||"?"}, baisses ${S.baisses??"?"}, propriétaires : ${S.proprio||"?"}, délai : ${S.delai||"?"}, permis déposé : ${S.permis||"?"}
Terrain : maison ${S.position||"?"}, accès ${S.acces||"?"}, entrées ${S.entrees||"?"}
Marché : ${S.pm2} €/m², terrain à bâtir ${S.lot||"non renseigné"} €, état ${S.travaux}, DPE ${S.dpe}
Valeur en un seul lot : ${rng(r.v1,.07)}${lever?`\nPiste : ${r.best.nom} – total des lots ≈ ${eur(r.best.v2)} – accord prix de référence : ${S.ref}`:""}
Fiche : ${FID||"nouvelle"}\nAgent : ${$("ag")?$("ag").value:""} – ${$("tel")?$("tel").value:""}`;
}
let last=null;
function verdict(again){
  if(!again)hist.push(idx);idx="verdict";chrome();
  const r=compute();if(!r.ok)return restart();
  const lever=!stopInfo&&r.lever&&S.ref!=="non";last={r,lever};
  const why=reasons(r,lever);
  const ecart=+S.prix>0?Math.round((+S.prix/r.v1-1)*100):null;
  let h=`<span class="chip ${lever?"go":"no"}">${lever?"Levier possible":"Pas de levier PLU Value"}</span>
  <h1>${lever?"Ce bien peut se vendre plus cher en plusieurs lots.":"Sur ce bien, le levier est le prix."}</h1>
  <div class="card"><h2>Pourquoi</h2><ul class="why">${why.map(([k,t])=>`<li class="${k}"><b>${SYM[k]}</b><span>${esc(t)}</span></li>`).join("")}</ul>
    <div class="fig"><span>Valeur réaliste, vendu en un seul lot</span><strong>${rng(r.v1,.07).replace(" et "," à ")}</strong>
    <em>Soit environ ${Math.round(r.pBig/50)*50} €/m²${ecart!==null?(ecart>3?`. Le prix affiché est ${ecart} % au-dessus.`:ecart<-3?`. Le prix affiché est ${-ecart} % en dessous.`:". Le prix affiché est dans la fourchette."):"."}</em></div></div>`;
  if(lever){
    h+=`<div class="sheet"><div class="eyebrow">À remettre au vendeur</div><h2>Première estimation en valorisation, ${esc(S.commune)}</h2>
      <div class="fig"><span>Vendu en un seul lot aujourd'hui</span><strong>${rng(r.v1,.07).replace(" et "," à ")}</strong></div>
      <div class="fig best"><span>Vendu en plusieurs lots</span><strong>${eur(r.best.v2*.88)} à ${eur(r.best.v2*.98)}</strong><em>Sous réserve de l'accord de la mairie et de la vérification sur les ventes réelles.</em></div>
      <ol><li>Un prix de référence est fixé avec vous, à partir de la valeur en un seul lot.</li><li>PLU Value avance tous les frais : études, géomètre, démarches en mairie.</li>
      <li>Vous restez propriétaire jusqu'aux ventes chez votre notaire.</li><li>PLU Value ne gagne rien si les lots se vendent au prix de référence. Elle se rémunère sur une part de ce qui est vendu au-dessus.</li></ol>
      <p class="legal">Avis indicatif établi à partir des informations transmises. Ce n'est ni une expertise, ni une offre d'achat, ni un engagement de prix.</p></div>
    <button class="cta ghost" type="button" data-act="copyFiche">Copier la fiche vendeur</button><div class="status" id="status2"></div>
    <div class="card"><h2>Lancer l'étude complète</h2><p class="lede">Gratuite. PLU Value vérifie l'urbanisme et les ventes réelles, puis vous rappelle. Elle ne contacte jamais votre vendeur sans vous.</p>
      <div class="two"><label for="ag">Nom et agence<input id="ag" type="text" autocomplete="name"></label><label for="tel">Téléphone<input id="tel" type="tel" inputmode="tel" autocomplete="tel"></label></div>
      <button class="cta" type="button" data-act="send">Transmettre le dossier à PLU Value</button>
      <a class="cta ghost" id="wa" href="https://wa.me/33756986700" target="_blank" rel="noopener">Ou l'envoyer par WhatsApp</a>
      <a class="cta ghost" href="/deposer-un-bien?profil=agent&diag=1">Déposer le mandat avec la charte de non-contournement</a>
      <button class="cta ghost" type="button" data-act="copyDossier">Copier le dossier pour un e-mail</button>
      <div class="status" id="status"></div><p class="legal">E-mail : <span class="mono">contact@plu-value.fr</span> · WhatsApp : <span class="mono">07 56 98 67 00</span></p></div>`;
  }else{
    h+=`<div class="card"><h2>Ce que vous pouvez dire au vendeur</h2><p class="say" id="say">Les ventes du secteur placent un bien de cette taille entre ${rng(r.v1,.07)}. ${ecart>3?`Le prix demandé est ${ecart} % au-dessus. `:""}Le potentiel de division a été étudié : il ne permet pas de vendre plus cher ici. Le levier qui reste est le prix.</p>
      <button class="cta ghost" type="button" data-act="copySay">Copier ce texte</button><div class="status" id="status"></div></div>`;
  }
  h+=`
  <button class="cta ghost" type="button" data-act="restart">Tester un autre bien</button>`;
  view.innerHTML=h;
  if(lever){const up=()=>$("wa").href="https://wa.me/33756986700?text="+encodeURIComponent(dossierTexte(r,true));up();$("ag").addEventListener("input",up);$("tel").addEventListener("input",up)}
  if(!again&&!isEx)api(payload()).catch(()=>{});
}
function payload(){const{r,lever}=last;return{action:"save",fiche_id:FID,reponses:S,agent:$("ag")?$("ag").value:"",tel:$("tel")?$("tel").value:"",
  resultat:{levier:lever,bloc:Math.round(r.v1),piste:r.best?r.best.nom:"",total_lots:r.best?Math.round(r.best.v2):0,motif:stopInfo?stopInfo.t:(lever?"":(S.ref==="non"?"refus prix de référence":r.raisons.join(" | ")))}}}
function copy(t,ok){
  const fail=()=>{$("status").textContent="Copie impossible ici : sélectionnez le texte ci-dessous.";const ta=document.createElement("textarea");ta.className="fallback";ta.readOnly=true;ta.value=t;$("status").after(ta);ta.select()};
  try{navigator.clipboard.writeText(t).then(()=>{$("status").textContent=ok},fail)}catch(e){fail()}
}
const ACT={
  agent(){hist.push(idx);drawAgent()},
  start(){hist.push(idx);drawLien()},
  manuel(){go(0)},
  suite(){go(0)},
  corriger(){K=new Set();go(0)},
  exemple(){S={...EXEMPLE};isEx=true;verdict()},
  restart,
  bloc(){blocOnly=true;go(0)},
  copyFiche(){copy(ficheTexte(last.r),"Fiche vendeur copiée.")},
  copyDossier(){copy(dossierTexte(last.r,last.lever),"Dossier copié : collez-le dans un e-mail à contact@plu-value.fr.")},
  copySay(){copy($("say").textContent,"Texte copié.")},
  async send(btn){
    if(!$("ag").value.trim()||!$("tel").value.trim()){$("status").textContent="Indiquez votre nom et votre téléphone pour être rappelé.";$("ag").focus();return}
    btn.disabled=true;
    try{const r=await api(payload());$("status").textContent=r.ok?"Dossier transmis. PLU Value vous rappelle.":"Envoi impossible : utilisez WhatsApp ou l'e-mail."}
    catch(e){$("status").textContent="Envoi impossible : utilisez WhatsApp ou l'e-mail."}
    finally{btn.disabled=false}
  }
};
(function(){var q=new URLSearchParams(location.search).get("profil");
  if(["proprietaire","heritier","notaire","autre"].includes(q)){location.replace("/deposer-un-bien?profil="+q);return}
  if(q==="agent"){hist=[-1];drawAgent()}else draw()})();
